services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Mount the correct Hyperledger Fabric directories from WSL (use absolute path)
      - /home/route/hyperledger-fabric/fabric-samples/test-network:/hyperledger
    env_file:
      - .env
    depends_on:
      - db
      - ipfs
    # Add this to ensure proper network connectivity
    networks:
      - default

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  ipfs:
    image: ipfs/go-ipfs:latest
    ports:
      - "4001:4001"
      - "5001:5001"  # This exposes IPFS API
      - "8080:8080"  # This exposes IPFS Gateway
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - default

volumes:
  postgres_data:
  ipfs_data:

networks:
  default:
    driver: bridge